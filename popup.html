<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docs Dark Mode</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 260px;
      padding: 16px;
      background-color: #121212;
      color: #ffffff;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-icon {
      font-size: 22px;
      line-height: 1;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .subtitle {
      font-size: 11px;
      color: #999999;
      margin-top: 2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 14px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30d158;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1c1c1e;
      border: 1px solid #2c2c2e;
      color: #e5e5e7;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover {
      background-color: #2c2c2e;
      border-color: #3a3a3c;
    }

    .option-btn.active {
      background-color: #252528;
      border-color: #0a84ff;
      color: #ffffff;
      font-weight: 500;
    }

    .option-btn.active::after {
      content: "✓";
      color: #0a84ff;
      font-weight: bold;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #222222;
      font-size: 11px;
      color: #777777;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🌙</div>
    <div>
      <div class="title">Docs Dark Mode</div>
      <div class="subtitle">Auto sunset & black theme</div>
    </div>
  </div>

  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Detecting system theme...</span>
  </div>

  <div class="options">
    <button class="option-btn active" data-mode="auto">
      <span class="option-label"><span>🌓</span> Auto (Sunset / System)</span>
    </button>
    <button class="option-btn" data-mode="dark">
      <span class="option-label"><span>🌑</span> Always Dark</span>
    </button>
    <button class="option-btn" data-mode="light">
      <span class="option-label"><span>☀️</span> Always Light</span>
    </button>
  </div>

  <div class="footer">
    Auto mode follows your Mac's Dark Mode at sunset.<br />
    Fullscreen: Option+Shift+F (⌥⇧F). Esc or the same shortcut exits.
  </div>

  <script src="popup.js"></script>
</body>
</html>
